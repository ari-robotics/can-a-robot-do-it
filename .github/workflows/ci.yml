name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    timeout-minutes: 20
    env:
      MUJOCO_GL: egl
    steps:
      - name: System libraries (git, headless rendering)
        timeout-minutes: 5
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates libegl1 libgles2 libgl1-mesa-dri
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -e ".[simready,dev]"
      - name: Robot models
        run: ari-sim setup --objects 0
      - name: Tests
        run: pytest -q
      - name: Example scene compiles and renders
        run: ari-sim check examples/goods_to_person_station/scene.json --out ci_out
      - name: Quick diagnostic on the example
        run: ari-sim diagnose examples/goods_to_person_station/scene.json --out ci_out --variants 2 --no-video
