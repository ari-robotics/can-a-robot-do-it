[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ari-sim"
version = "0.1.0"
description = "Photos of a workstation -> robot simulation -> engineering diagnostic"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ARI — Applied Robotics Institute" }]
keywords = ["robotics", "mujoco", "robot-simulation", "cobot", "workcell", "feasibility", "claude-code"]
requires-python = ">=3.10"
dependencies = ["mujoco>=3.3", "numpy", "pillow"]

[project.urls]
Homepage = "https://github.com/ari-robotics/can-a-robot-do-it"
Organization = "https://arirobotics.ch"

[project.optional-dependencies]
simready = ["usd-core"]
dev = ["pytest"]

[project.scripts]
ari-sim = "ari_sim.cli:main"

[tool.setuptools]
packages = ["ari_sim"]
